version: '3'
services:
  db: 
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=wadetran
      - POSTGRES_DB=diarydb
      - POSTGRES_PASSWORD=linggangguliguli
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app: 
    image: postgres
    environment:
      - DATABASE_URL=postgresql://wadetran:linggangguliguli@db:5432/diarydb
      - JWT_SECRET=taolabochungmay
      - PORT=5000
    ports:
      - "5000:3000"
    volumes:
      - .:/app
volumes:
  postgres-data: